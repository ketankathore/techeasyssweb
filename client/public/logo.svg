<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded hexagon -->
  <rect x="8" y="8" width="84" height="84" rx="24" fill="#0f172a" stroke="url(#brandGrad)" stroke-width="2.5" />

  <!-- Abstract Code & T-symbol -->
  <path d="M 28 32 L 72 32 M 50 32 L 50 72" stroke="url(#brandGrad)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Modern Geometric Brackets -->
  <path d="M 32 46 L 22 52 L 32 58" fill="none" stroke="url(#glowGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 68 46 L 78 52 L 68 58" fill="none" stroke="url(#glowGrad)" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Glowing Accent dot -->
  <circle cx="50" cy="72" r="4.5" fill="#06b6d4" filter="url(#glow)" />
</svg>
